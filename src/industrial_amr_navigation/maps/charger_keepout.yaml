# Keepout mask for Nav2's KeepoutFilter (see config/nav2_params.yaml). Marks the
# charger's 0.10 m base plate, which is below the LIDAR plane, plus a 0.3 m
# margin. Same frame as the maps: the robot spawns at the world origin.
image: charger_keepout.pgm
mode: trinary
resolution: 0.05
origin: [-5.2, -4.2, 0.0]
negate: 0
occupied_thresh: 0.65
free_thresh: 0.196
